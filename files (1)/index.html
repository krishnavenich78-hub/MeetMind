<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MeetMind</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mu:#6b6a64;--bd:#e3e1d8;--ac:#4b3fd6;--ok:#1f8a4c;--wa:#b7791f;--er:#c2410c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151517;--card:#1f1f23;--tx:#eeeee9;--mu:#9b9a94;--bd:#33333a;--ac:#8b82ff;--ok:#4ade80;--wa:#fbbf24;--er:#fb923c}}
:root[data-theme="dark"]{--bg:#151517;--card:#1f1f23;--tx:#eeeee9;--mu:#9b9a94;--bd:#33333a;--ac:#8b82ff;--ok:#4ade80;--wa:#fbbf24;--er:#fb923c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--bd);background:var(--card);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.logo{font-weight:700;font-size:18px;margin-right:12px}.logo b{color:var(--ac)}
nav{display:flex;gap:4px;flex-wrap:wrap}nav button{border:0;background:none;color:var(--mu);padding:7px 12px;border-radius:8px;font:inherit;cursor:pointer}
nav button.on{background:var(--ac);color:#fff}
main{max-width:920px;margin:0 auto;padding:22px 18px 60px}
h2{margin:0 0 4px;font-size:22px}h3{margin:18px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu)}
.sub{color:var(--mu);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid currentColor}
.ok{color:var(--ok)}.wa{color:var(--wa)}.er{color:var(--er)}.mu{color:var(--mu)}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
.btn.g{background:none;color:var(--ac);border:1px solid var(--bd)}
input,textarea,select{width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0 12px}
label{font-size:13px;color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.tl{border-left:2px solid var(--bd);margin-left:8px;padding-left:18px}.tl .card{position:relative}
.tl .card:before{content:"";position:absolute;left:-26px;top:18px;width:12px;height:12px;border-radius:50%;background:var(--ac);border:2px solid var(--bg)}
ul{margin:6px 0;padding-left:20px}li{margin:3px 0}.open{cursor:pointer}
.open input{width:auto;margin:0 8px 0 0}
.open{display:flex;align-items:flex-start;padding:6px 0}
.quote{border-left:3px solid var(--ac);padding:6px 12px;color:var(--tx);background:var(--bg);border-radius:0 8px 8px 0}
.seg{display:flex;gap:6px;margin:4px 0 12px}.seg button{flex:1;padding:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;cursor:pointer;font:inherit}.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.toast{position:fixed;left:16px;right:16px;max-width:560px;margin:0 auto;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--card);border:1px solid var(--ac);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:0 8px 30px rgba(0,0,0,.25);z-index:9}
</style></head><body>
<header><div class="logo">Meet<b>Mind</b></div><nav id="nav"><nav id="nav"></nav><span id="ai" class="pill mu" style="margin-left:auto">checking AI…</span></header>
<main id="app"></main><div id="bn"></div>
<script>
const $=s=>document.querySelector(s),esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TABS=[['dash','Dashboard'],['add','Add Meeting'],['brief','Brief'],['time','Timeline'],['learn','Learn']];
const R={p:/\b(will|shall|promised|agreed to|to send|to share|to schedule|by (mon|tues|wednes|thurs|fri)day|by tomorrow|next week)\b/i,c:/concern|worried|worry|risk|blocker|issue|expensive|budget|security|delay|unhappy/i,f:/prefer|likes|wants|asked for|only want|hates/i,d:/decided|agreed on|approved|confirmed|signed off/i,due:/(by (?:mon|tues|wednes|thurs|fri|satur|sun)day|by tomorrow|tomorrow|next week|this week|by end of \w+)/i};
function seed(){const m=[
{id:1,type:'past',title:'Pricing discussion',date:'2026-09-14',att:['Priya','Rahul'],notes:"Priya is worried about budget for the enterprise tier. Priya prefers short emails and a one-page summary. I will share the revised pricing tomorrow. Rahul will send API documentation by Friday. Decided to run a pilot with 20 users."},
{id:2,type:'past',title:'Technical deep-dive',date:'2026-09-21',att:['Rahul','Anil'],notes:"Rahul raised a security concern about data residency. Anil wants SSO support before rollout. The legal team will review the agreement by Friday. We will schedule a product demo next week. The customer will confirm their user count. Agreed on weekly check-ins.",outcome:{moved:'Yes',out:'Pilot scope agreed',worked:'Live architecture walkthrough landed well'}},
{id:3,type:'up',title:'Pilot kickoff with Acme',date:'2026-10-01',att:['Priya','Rahul','Anil'],notes:''}];
const p=[];m.filter(x=>x.type=='past').forEach(x=>ex(x.notes).promises.forEach(q=>p.push({id:p.length+1,mid:x.id,...q,done:q.text.includes('API doc')})));
return{m,p,n:10}}
function ex(n){const o={promises:[],concerns:[],prefs:[],decisions:[]};
(n.match(/[^.!?\n]+[.!?]?/g)||[]).map(s=>s.trim()).filter(Boolean).forEach(s=>{
const nm=(s.match(/^(I|We|[A-Z][a-z]+|The [a-z]+(?: team)?)\b/)||[])[1]||'Team';
if(R.p.test(s)&&/\b(will|shall|promised|to send|to share|to schedule)\b/i.test(s)&&!R.c.test(s))o.promises.push({owner:nm=='I'?'Me':nm,text:s.replace(/\.$/,''),due:(s.match(R.due)||[])[1]||'no date'});
else if(R.c.test(s))o.concerns.push(s);else if(R.f.test(s))o.prefs.push(s);else if(R.d.test(s))o.decisions.push(s);});return o}
let S;try{S=JSON.parse(localStorage.getItem('mm')||'null')}catch(e){}S=S||seed();
const save=()=>{try{localStorage.setItem('mm',JSON.stringify(S))}catch(e){}return api('/api/state','PUT',S).catch(()=>{})};
let tab='dash',sel=3,lf={moved:'Yes'};
const past=()=>S.m.filter(x=>x.type=='past').sort((a,b)=>a.date<b.date?-1:1);
const rel=m=>past().filter(x=>x.id!=m.id&&x.att.some(a=>m.att.includes(a)));
const openP=m=>S.p.filter(q=>!q.done&&rel(m).some(x=>x.id==q.mid));
function ready(m){const o=openP(m).length;return o==0?['Ready','ok']:o<3?['Needs attention','wa']:['At risk','er']}
function go(t){tab=t;render()}
function render(){$('#nav').innerHTML=TABS.map(([k,l])=>`<button class="${k==tab?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
$('#app').innerHTML=({dash,add,brief,time,learn})[tab]();window.scrollTo(0,0)}
function dash(){const up=S.m.filter(x=>x.type=='up').sort((a,b)=>a.date<b.date?-1:1);const all=S.p.filter(q=>!q.done).length;
return`<h2>Upcoming meetings</h2><p class="sub">${all} open commitments across all relationships.</p>`+(up.map(m=>{const[r,c]=ready(m);return`<div class="card row"><div><b>${esc(m.title)}</b><div class="mu">${m.date} · ${m.att.map(esc).join(', ')}</div></div><div class="row"><span class="pill ${c}">${r} · ${openP(m).length} open</span><button class="btn" onclick="sel=${m.id};go('brief')">Open brief</button></div></div>`}).join('')||'<div class="card mu">No upcoming meetings. Add one.</div>')+`<button class="btn g" onclick="go('add')">+ Add meeting</button> <button class="btn g" onclick="simulate()">⏰ Simulate calendar: meeting in 30 min</button>`}
function add(){return`<h2>Add meeting</h2><p class="sub">Paste notes, a transcript or an email summary. Promises, concerns and decisions are extracted automatically.</p><div class="card">
<label>Type</label><select id="t"><option value="past">Past meeting (with notes)</option><option value="up">Upcoming meeting</option></select>
<label>Title</label><input id="ti" placeholder="e.g. Contract review with Acme">
<label>Date</label><input id="d" type="date" value="2026-09-28">
<label>Attendees (comma separated)</label><input id="a" placeholder="Priya, Rahul">
<label>Notes / transcript</label><textarea id="n" rows="7" placeholder="Priya is worried about budget. I will share pricing tomorrow."></textarea>
<button class="btn" id="sv" onclick="addM()">Save & extract</button> <span id="st" class="mu"></span></div>`}
function tgl(id){const q=S.p.find(x=>x.id==id);q.done=!q.done;save();render()}
function brief(){const up=S.m.filter(x=>x.type=='up');if(!up.length)return'<div class="card mu">Create an upcoming meeting first.</div>';
let m=up.find(x=>x.id==sel)||up[0];const r=rel(m),op=openP(m),[rs,rc]=ready(m);
const ext=r.map(x=>({x,...X(x)}));const ctx=n=>ext.flatMap(e=>e[n].map(s=>({s,x:e.x})));
const learn=r.filter(x=>x.outcome&&x.outcome.worked);
const cards=m.att.map(a=>{const c=ctx('concerns').filter(o=>o.s.includes(a)),p=ctx('prefs').filter(o=>o.s.includes(a));const last=r.filter(x=>x.att.includes(a)).pop();const mine=op.filter(q=>q.owner==a||q.text.includes(a));
return`<div class="card"><b>${esc(a)}</b><div class="mu" style="font-size:13px">Last met: ${last?last.date+' · '+esc(last.title):'never'}</div>
<h3>Concerns</h3><ul>${c.map(o=>`<li>${esc(o.s)}</li>`).join('')||'<li class="mu">None recorded</li>'}</ul><h3>Preferences</h3><ul>${p.map(o=>`<li>${esc(o.s)}</li>`).join('')||'<li class="mu">None recorded</li>'}</ul>${mine.length?`<h3>Owes / involved</h3><ul>${mine.map(q=>`<li>${esc(q.text)}</li>`).join('')}</ul>`:''}</div>`}).join('');
const con=ctx('concerns');const dec=ctx('decisions');
const agenda=['Recap: '+(dec[0]?dec[0].s.replace(/\.$/,''):'where we left off'),op.length?`Review ${op.length} open commitment${op.length>1?'s':''} and confirm owners/dates`:'Confirm no commitments are outstanding',...con.slice(0,2).map(o=>'Address: '+o.s.replace(/\.$/,'')),'Agree next steps with dates'];
const mine=op.filter(q=>q.owner=='Me'||q.owner=='We');
const open=`Thanks for making time. Before we start, I want to close the loop on ${op.length?op.slice(0,2).map(q=>'"'+q.text.replace(/^(I|We|[A-Z][a-z]+) (will )?/,'')+'"').join(' and '):'our last discussion'}${con[0]?', and make sure we address your concern on '+(con[0].s.match(/(budget|security|data residency|delay|risk)/i)||['open items'])[0].toLowerCase():''}.`;
return`<div class="row"><div><h2>${esc(m.title)}</h2><p class="sub">${m.date} · ${m.att.map(esc).join(', ')}</p></div><span class="pill ${rc}">${rs}</span></div>
${up.length>1?`<select onchange="sel=+this.value;render()">${up.map(x=>`<option value="${x.id}" ${x.id==m.id?'selected':''}>${esc(x.title)}</option>`).join('')}</select>`:''}
<h3>Objectives</h3><div class="card"><ul><li>Close every open commitment (${op.length})</li>${dec[0]?`<li>Build on: ${esc(dec[0].s)}</li>`:''}<li>Leave with dated next steps</li></ul></div>
<h3>Unresolved commitments</h3><div class="card">${op.map(q=>`<label class="open" style="color:var(--tx);font-size:15px"><input type="checkbox" onchange="tgl(${q.id})"><span><b>${esc(q.owner)}</b>: ${esc(q.text)} <span class="pill mu" style="font-size:11px">${esc(q.due)}</span></span></label>`).join('')||'<span class="ok">All clear.</span>'}</div>
<h3>Stakeholder cards</h3><div class="grid">${cards}</div>
<h3>Ask your history</h3><div class="card"><div class="row" style="flex-wrap:nowrap"><input id="q" style="margin:0" placeholder="What did Priya say about budget?" onkeydown="if(event.key==='Enter')askH()"><button class="btn" onclick="askH()">Ask</button></div><div id="ans" style="margin-top:10px"></div></div><h3>Recommended agenda</h3><div class="card"><ol style="margin:0;padding-left:20px">${agenda.map(a=>`<li>${esc(a)}</li>`).join('')}</ol></div>
<h3>Suggested opening</h3><div class="quote">${esc(open)}</div>
${learn.length?`<h3>What worked before</h3><div class="card"><ul>${learn.map(x=>`<li>${esc(x.outcome.worked)} <span class="mu">(${esc(x.title)})</span></li>`).join('')}</ul></div>`:''}`}
function time(){const att=[...new Set(S.m.flatMap(x=>x.att))];const f=window.tf||'';const L=past().filter(x=>!f||x.att.includes(f)).reverse();
return`<h2>Relationship timeline</h2><p class="sub">Every meeting distilled to what matters.</p><select onchange="window.tf=this.value;render()"><option value="">All people</option>${att.map(a=>`<option ${a==f?'selected':''}>${esc(a)}</option>`).join('')}</select><div class="tl">`+
(L.map(x=>{const e=X(x),mp=S.p.filter(q=>q.mid==x.id);const tag=(l,c,a)=>a.length?`<div><span class="pill ${c}">${l}</span><ul>${a.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div>`:'';
return`<div class="card"><div class="row"><b>${esc(x.title)}</b><span class="mu">${x.src?`<span class="pill ${x.src=='AI'?'ok':'mu'}" style="font-size:11px">${x.src=='AI'?'✨ AI':'Rules'}</span> `:''}${x.date}</span></div><div class="mu" style="font-size:13px">${x.att.map(esc).join(', ')}${x.outcome?` · Moved forward: <b>${esc(x.outcome.moved)}</b> · ${esc(x.outcome.out)}`:''}</div>${tag('Decisions','ok',e.decisions)}${tag('Concerns','er',e.concerns)}${tag('Promises','wa',mp.map(q=>(q.done?'✓ ':'')+q.owner+': '+q.text))}${tag('Preferences','mu',e.prefs)}<button class="btn g" onclick="draftE(${x.id})">✉ Draft follow-up email</button><div id="em${x.id}"></div></div>`}).join('')||'<div class="card mu">No past meetings yet.</div>')+'</div>'}
function learn(){const ms=S.m.slice().sort((a,b)=>a.date<b.date?1:-1);if(!ms.length)return'';const id=window.lid||ms[0].id;
return`<h2>Post-meeting learning</h2><p class="sub">Three quick questions. MeetMind uses the answers in your next brief.</p><div class="card">
<label>Meeting</label><select id="lm" onchange="window.lid=+this.value">${ms.map(x=>`<option value="${x.id}" ${x.id==id?'selected':''}>${esc(x.title)} · ${x.date}</option>`).join('')}</select>
<label>1. Did the meeting move forward?</label><div class="seg">${['Yes','Partly','No'].map(v=>`<button class="${lf.moved==v?'on':''}" onclick="lf.moved='${v}';keep();render()">${v}</button>`).join('')}</div>
<label>2. What was the outcome?</label><input id="lo" value="${esc(lf.out||'')}">
<label>3. What worked or did not work?</label><input id="lw" value="${esc(lf.worked||'')}">
<label>New promises or decisions (one per line, optional)</label><textarea id="ln" rows="3" placeholder="Rahul will send the SOW by Monday.">${esc(lf.nw||'')}</textarea>
<button class="btn" onclick="saveL()">Save learning</button></div>`}
function keep(){lf.out=$('#lo').value;lf.worked=$('#lw').value;lf.nw=$('#ln').value}
let aiOn=false,tmr=null;
async function api(p,method,body){const r=await fetch(p,{method:method||'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});if(!r.ok)throw new Error(r.status);return r.json()}
(async()=>{try{aiOn=(await api('/api/health')).ai}catch(e){}const e=$('#ai');e.textContent=aiOn?'✨ AI on':'Rules mode';e.className='pill '+(aiOn?'ok':'mu')})();
async function aiExtract(notes,att){try{const r=await api('/api/extract','POST',{notes,attendees:att});return{src:r.source=='ai'?'AI':'Rules',promises:r.promises,concerns:r.concerns,prefs:r.preferences,decisions:r.decisions}}catch(e){return{src:'Rules',...ex(notes)}}}
const X=m=>m.x||ex(m.notes);
async function addM(){const t=$('#t').value,ti=$('#ti').value.trim(),a=$('#a').value.split(',').map(s=>s.trim()).filter(Boolean);if(!ti||!a.length){alert('Add a title and at least one attendee.');return}
const m={id:S.n++,type:t,title:ti,date:$('#d').value,att:a,notes:$('#n').value};$('#sv').disabled=true;$('#st').textContent=t=='past'?(aiOn?'✨ Extracting with AI…':'Extracting…'):'Saving…';
if(t=='past'){const r=await aiExtract(m.notes,a);m.src=r.src;m.x={concerns:r.concerns,prefs:r.prefs,decisions:r.decisions};r.promises.forEach(q=>S.p.push({id:S.n++,mid:m.id,...q,done:false}))}
S.m.push(m);save();sel=m.id;go(t=='up'?'brief':'time')}
async function saveL(){keep();const id=+$('#lm').value,m=S.m.find(x=>x.id==id);m.type='past';m.outcome={moved:lf.moved,out:lf.out,worked:lf.worked};
if(lf.nw.trim()){const r=await aiExtract(lf.nw,m.att);r.promises.forEach(q=>S.p.push({id:S.n++,mid:id,...q,done:false}));m.notes+=' '+lf.nw.replace(/\n/g,'. ');m.x=m.x||ex(m.notes);m.x.decisions=[...(m.x.decisions||[]),...r.decisions]}
await save();lf={moved:'Yes'};window.lid=null;go('time');draftE(id)}
async function askH(){const q=$('#q').value.trim(),o=$('#ans');if(!q)return;o.innerHTML='<span class="mu">Searching your history…</span>';
try{await save();const r=await api('/api/ask','POST',{question:q});o.innerHTML=`<div class="quote">${esc(r.answer).replace(/\n/g,'<br>')}</div><div class="mu" style="font-size:12px;margin-top:6px">${r.source=='ai'?'✨ AI':'Keyword search'} · Sources: ${r.sources.map(x=>esc(x.title)+' ('+x.date+')').join(', ')||'none'}</div>`}catch(e){o.innerHTML='<span class="er">Backend unreachable.</span>'}}
async function draftE(id){const o=$('#em'+id);if(!o)return;o.innerHTML='<span class="mu">Drafting email…</span>';
try{await save();const r=await api('/api/email','POST',{meeting_id:id});o.innerHTML=`<textarea rows="12" style="margin-top:10px">${esc(r.email)}</textarea><button class="btn g" onclick="navigator.clipboard&&navigator.clipboard.writeText(this.previousElementSibling.value);this.textContent='Copied ✓'">Copy</button>`}catch(e){o.innerHTML='<span class="er">Backend unreachable.</span>'}}
function simulate(){const m=S.m.find(x=>x.type=='up');if(!m){alert('Create an upcoming meeting first.');return}
let s=1800;clearInterval(tmr);const[r,c]=ready(m);
$('#bn').innerHTML=`<div class="toast"><div><b>⏰ Starts in <span id="cd">30:00</span></b><div class="mu" style="font-size:13px">${esc(m.title)} · brief auto-prepared · <span class="${c}">${r}, ${openP(m).length} open</span></div></div><div><button class="btn" onclick="sel=${m.id};dismiss();go('brief')">Open brief</button> <button class="btn g" onclick="dismiss()">✕</button></div></div>`;
tmr=setInterval(()=>{s--;const e=$('#cd');if(!e||s<0)return dismiss();e.textContent=String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},1000)}
function dismiss(){clearInterval(tmr);$('#bn').innerHTML=''}
(async()=>{try{const r=await api('/api/state');if(r.m&&r.m.length){S=r;render()}else await save()}catch(e){}})();
render();
</script></body></html>
